name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Core tests
        run: pnpm test
      - name: Build and sign local app
        run: pnpm build
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Tiny Assets.app" "dist/tiny-assets-macOS.zip"
      - name: Upload macOS app
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tiny-assets-macOS
          path: dist/tiny-assets-macOS.zip
          if-no-files-found: error
