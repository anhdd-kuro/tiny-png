name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core tests
        run: npm test
      - name: Build and sign local app
        run: npm run build
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Tiny PNG.app" "dist/Tiny PNG-macOS.zip"
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Tiny-PNG-macOS
          path: dist/Tiny PNG-macOS.zip
          if-no-files-found: error
