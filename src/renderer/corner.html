<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'">
  <title>Tiny PNG — Thả ảnh</title>
  <link rel="stylesheet" href="styles.css">
  <script src="corner.js" defer></script>
</head>
<body class="corner-window">
  <button id="corner-drop" class="corner-drop" type="button" aria-label="Tiny PNG — thả ảnh hoặc nhấn để mở cửa sổ chính">
    <svg id="corner-photo" class="corner-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="6" y="5" width="28" height="29" rx="5" stroke="currentColor" stroke-width="1.8"/><path d="m7 26 9-9 8 8 5-5 5 6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="26" cy="13" r="2.6" fill="currentColor"/></svg>
    <span id="corner-warning" class="corner-warning" aria-hidden="true" hidden>!</span>
    <span id="corner-label" class="corner-label" role="status" aria-live="polite">Thả ảnh</span>
  </button>
</body>
</html>
